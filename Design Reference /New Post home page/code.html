<body class="bg-background text-on-background antialiased min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/60 backdrop-blur-md border-b border-white/10 flex justify-between items-center px-gutter h-16 w-full">
<button class="text-on-surface-variant hover:opacity-80 scale-95 active:transition-transform">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-display-lg text-headline-lg-mobile text-primary-fixed tracking-wider">NEW POST</h1>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 mb-safe pb-24 px-gutter py-stack-md flex flex-col gap-stack-lg max-w-2xl mx-auto w-full">
<!-- Photo Upload / Preview Area -->
<section class="w-full aspect-[4/5] rounded-xl overflow-hidden glass-panel relative group cursor-pointer border border-white/10 hover:border-primary-fixed/50 transition-colors flex flex-col items-center justify-center">

<div class="relative z-10 flex flex-col items-center gap-unit text-center">
<span class="material-symbols-outlined text-stat-lg text-primary-fixed drop-shadow-md">add_a_photo</span>
<p class="font-label-caps text-label-caps text-on-surface uppercase tracking-widest mt-2">Add Photo or Video</p>
</div>
<div class="absolute bottom-4 right-4 z-10">
<button class="bg-surface-container-high rounded-full p-2 border border-white/10 text-on-surface hover:text-primary-fixed transition-colors">
<span class="material-symbols-outlined text-xl">edit</span>
</button>
</div>
</section>
<!-- Caption Input -->
<section class="w-full">
<textarea class="w-full bg-transparent border-0 border-b border-white/10 focus:border-primary-fixed focus:ring-0 px-0 py-unit font-body-lg text-body-lg text-on-background placeholder-on-surface-variant resize-none" placeholder="Describe your session..." rows="3"></textarea>
</section>
<!-- Achievement Tags -->
<section class="flex flex-col gap-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Achievements &amp; Tags</label>
<div class="flex gap-2 overflow-x-auto no-scrollbar pb-2 pt-1">
<!-- Selected Tag -->
<button class="whitespace-nowrap rounded-full px-4 py-2 border border-primary-fixed bg-primary-fixed/10 text-primary-fixed font-label-caps text-label-caps flex items-center gap-2 glow-active">
<span class="material-symbols-outlined text-[16px]">local_fire_department</span>
                    PR: 140 KG
                </button>
<button class="whitespace-nowrap rounded-full px-4 py-2 border border-white/10 bg-surface-container-high text-on-surface font-label-caps text-label-caps flex items-center gap-2 hover:border-white/30 transition-colors">

                    2H SESSION
                </button>
<button class="whitespace-nowrap rounded-full px-4 py-2 border border-white/10 bg-surface-container-high text-on-surface font-label-caps text-label-caps flex items-center gap-2 hover:border-white/30 transition-colors">
<span class="material-symbols-outlined text-[16px]">fitness_center</span>

                </button>
<button class="whitespace-nowrap rounded-full px-4 py-2 border border-dashed border-white/20 text-on-surface-variant font-label-caps text-label-caps flex items-center gap-1 hover:text-primary-fixed hover:border-primary-fixed/50 transition-colors">

<div>
<p class="font-body-md text-body-md text-on-surface">Public to Gym</p>
<p class="font-label-caps text-[10px] text-on-surface-variant">Anyone in your gym network can view</p>
</div>
</div>

<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-fixed"></div>
</label>
</div>
<div class="h-px bg-white/10 w-full"></div>
<div class="flex justify-between items-center opacity-50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant">group</span>
<div>
<p class="font-body-md text-body-md text-on-surface">Followers Only</p>
<p class="font-label-caps text-[10px] text-on-surface-variant">Restricted visibility</p>
</div>
</div>
<!-- Custom Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" disabled="" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-fixed"></div>
</label>
</div>
</section>
