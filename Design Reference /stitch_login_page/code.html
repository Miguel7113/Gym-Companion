</div>

<div class="flex flex-col gap-unit">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary uppercase">Fuel Your Drive.</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Connect with your local facility and access exclusive workouts, stats, and community.</p>
</div>
<form class="flex flex-col gap-stack-sm">
<!-- Gym Selection Dropdown -->
<div class="relative group">
<label class="sr-only" for="gym-select">Find Your Gym</label>
<div class="flex items-center bg-white/5 border-b border-white/20 rounded-t-DEFAULT px-4 py-3 pulse-glow transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant mr-3">location_on</span>
<select class="w-full bg-transparent text-primary font-body-md text-body-md appearance-none outline-none focus:ring-0 border-none p-0 cursor-pointer" id="gym-select">
<option class="text-on-surface-variant bg-surface" disabled="" selected="" value="">Find Your Gym</option>
<option class="bg-surface text-primary" value="downtown">Pulse - Downtown Metro</option>
<option class="bg-surface text-primary" value="westside">Pulse - Westside Iron</option>
<option class="bg-surface text-primary" value="uptown">Pulse - Uptown Heights</option>
<option class="bg-surface text-primary" value="east">Pulse - East End Studio</option>
</select>
<span class="material-symbols-outlined text-on-surface-variant pointer-events-none absolute right-4">arrow_drop_down</span>
</div>
</div>
<div class="relative group">
<label class="sr-only" for="email">Email Address</label>
<div class="flex items-center bg-white/5 border-b border-white/20 rounded-t-DEFAULT px-4 py-3 pulse-glow transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant mr-3">mail</span>
<input class="w-full bg-transparent text-primary font-body-md text-body-md outline-none focus:ring-0 border-none p-0 placeholder:text-on-surface-variant/50" id="email" placeholder="Email Address" type="email"/>
</div>
</div>

<label class="sr-only" for="password">Password</label>
<div class="flex items-center bg-white/5 border-b border-white/20 rounded-t-DEFAULT px-4 py-3 pulse-glow transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant mr-3">lock</span>
<input class="w-full bg-transparent text-primary font-body-md text-body-md outline-none focus:ring-0 border-none p-0 placeholder:text-on-surface-variant/50" id="password" placeholder="Password" type="password"/>
</div>
</div>
<div class="flex flex-col gap-unit mt-stack-sm">
<button class="w-full bg-[#CCFF00] text-black font-headline-md text-headline-md uppercase py-3 rounded-DEFAULT active:scale-[0.98] transition-transform duration-200" type="button">

                    </button>
<button class="w-full bg-transparent border border-[#CCFF00] text-[#CCFF00] font-headline-md text-headline-md uppercase py-3 rounded-DEFAULT active:scale-[0.98] transition-transform duration-200 hover:bg-[#CCFF00]/10" type="button">
